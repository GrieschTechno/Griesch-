name: Build AUDIOCORE DARK BASS (Windows)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --parallel
      - name: Package plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if ($null -eq $plugin) { throw "VST3 bundle was not produced." }
          Compress-Archive -Path $plugin.FullName -DestinationPath dist/AUDIOCORE_DARK_BASS_VST3.zip -Force
          Get-ChildItem -Path build -Recurse -Filter "*.exe" | ForEach-Object { Copy-Item $_.FullName -Destination dist -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: AUDIOCORE-DARK-BASS-Windows
          path: dist/*
          if-no-files-found: error
